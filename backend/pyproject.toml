[project]
name = "route-optimizer-backend"
version = "0.1.0"
description = "Cloud Function que optimiza rutas con algoritmo genetico"
requires-python = ">=3.12"
dependencies = [
    "functions-framework>=3.8.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "firebase-admin>=6.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
