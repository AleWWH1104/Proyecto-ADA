[project]
name = "maps-lab"
version = "0.1.0"
description = "Cloud Function que consulta Google Maps Places API"
requires-python = ">=3.12"
dependencies = [
    "functions-framework>=3.8.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "jupyter>=1.1.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
